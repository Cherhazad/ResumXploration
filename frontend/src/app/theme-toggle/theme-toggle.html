<div class="flex justify-end">
  <button
    pButton
    rounded
    severity="secondary"
    aria-label="Change color mode" (click)="onToggle()"
    class="p-2 rounded-lg border border-gray-300 dark:border-gray-600
         bg-white dark:bg-gray-800
         text-gray-800 dark:text-gray-100
         hover:bg-gray-100 dark:hover:bg-gray-700
         transition-colors"
    [attr.aria-label]="themeService.theme() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'"

  >
    @if (themeService.theme() === 'dark') {
      <svg data-p-icon="sun"></svg>
    } @else {
      <svg data-p-icon="moon"></svg>
    }
  </button>
</div>
