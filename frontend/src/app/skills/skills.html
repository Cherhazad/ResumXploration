<section class="skills" id="skills">
  <div class="container hide-left">
    <h3>Compétences</h3>
    <p>Voici une liste non exhaustive des outils que j'utilise et des compétences acquises en back et front.</p>
    <div class="skills-infos">
      <div class="skill-items">
        @for (skill of skills; track skill; let i = $index) {
          <div class="flex flex-col items-center gap-2 item" [style.transition-delay]="(i * 40) + 'ms'">
            <i [class]="skill.icon"></i>
            <span>{{ skill.content }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</section>
